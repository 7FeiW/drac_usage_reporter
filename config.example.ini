# drac_usage_reporter settings: copy this file to config.ini (git-ignored) and edit it.
#
#   cp config.example.ini config.ini
#
# Replace <pi> in the account names with your group's (`check` lists the accounts you belong to).
# The fir and narval sections are complete otherwise. Anything left out of [report] or [flags] falls back to a
# built-in default (the [flags] values below are those defaults), so a config.ini only needs its
# [cluster ...] sections and the lines it changes. Use another file with --config FILE or
# $DRAC_USAGE_CONFIG.

[report]
group = My lab
# Clusters used when --cluster is not given (comma-separated; `all` = every [cluster] section).
clusters = fir, narval
# sreport windows in days; fetch pulls sacct job records for the longest one.
windows = 30, 90, 180
# Local cache: fetch keeps it up to date, report reads it (relative to the repo root).
data_dir = data/cache
# Rolling cache: keep this many days of usage and finished jobs; older data is dropped on fetch.
# Never less than the longest window. `report --date` can only look back this far.
cache_days = 365
# Where the do-it-all command saves its reports (relative to the repo root). Hand-written reports
# go in reports/ itself and are never overwritten.
reports_dir = reports/auto
# Request shapes listed per cluster in the report.
top = 25
# When no shared ssh connection is open, open one (asking for MFA / host key in the terminal)
# and close it again when the command ends. Connections you opened yourself are left alone.
auto_connect = yes

[flags]
# Groups whose "at stake" number (RGU-h on GPU accounts, core-h on CPU accounts) is smaller
# than this are not flagged.
min_at_stake = 200
# Severity: high at or above `high`, medium at or above `medium`, else low.
high = 10000
medium = 1000
# CPU accounts: flag request shapes whose cores are used less than this share of the time.
idle_cpu = 0.6
# Flag shapes where at least this share of started jobs timed out / really failed.
timeout_rate = 0.3
fail_rate = 0.1
# A job is "at its memory limit" when peak RSS reaches this share of the request.
mem_ceiling = 0.95
# Flag users with at least this many jobs marked FAILED whose work step completed.
masked_min_jobs = 5

# One section per cluster: [cluster <name>].
#   host             full SSH hostname (no ~/.ssh/config alias needed)
#   user             ssh login name (default: from ~/.ssh/config or the local user)
#   identity_file    ssh key (default: from ~/.ssh/config)
#   ssh_options      extra ssh arguments, e.g. ControlMaster settings
#   accounts         Slurm accounts to report on
#   sacct_chunk_days sacct date window per call (fir refuses wide ranges)
#   rgu_per_core     billing weight of one core, RGU/h  } Slurm bills a job by the largest of
#   rgu_per_gb       billing weight of one GB, RGU/h    } its GPU, core and memory charges.
#   gpu <type>       RGU per GPU-hour, gres name in sreport. <type> is the gres name after its
#                    last "_" (e.g. 3g.40gb).
# `python -m drac_usage_reporter check` compares these with the cluster's TRESBillingWeights
# and prints the lines to use when they differ.

[cluster fir]
host = fir.alliancecan.ca
user = <ccdb_username>
identity_file = ~/.ssh/<ssh_key>
ssh_options = -o BatchMode=yes -o ConnectTimeout=30
accounts = rrg-<pi>_gpu, def-<pi>_gpu, rrg-<pi>_cpu, def-<pi>_cpu
sacct_chunk_days = 10
# From TRESBillingWeights on fir, 2026-10-29.
rgu_per_core = 1.01667
rgu_per_gb = 0.04236
gpu h100 = 12.2, gres/gpu:h100
gpu 3g.40gb = 5.22857, gres/gpu:nvidia_h100_80gb_hbm3_3g.40gb
gpu 2g.20gb = 3.48571, gres/gpu:nvidia_h100_80gb_hbm3_2g.20gb
gpu 1g.10gb = 1.74286, gres/gpu:nvidia_h100_80gb_hbm3_1g.10gb

[cluster narval]
host = narval.alliancecan.ca
user = <ccdb_username>
identity_file = ~/.ssh/<ssh_key>
# ControlPath: a connection opened once with
#   ssh -o ControlMaster=yes -o ControlPath=~/.ssh/cm-narval -o ControlPersist=4h -fN <ccdb_username>@narval.alliancecan.ca
# is reused by every command (one MFA approval for 4 hours).
ssh_options = -o BatchMode=yes -o ConnectTimeout=30 -o ControlPath=~/.ssh/cm-narval
accounts = rrg-<pi>_gpu, def-<pi>_gpu, rrg-<pi>_cpu, def-<pi>_cpu
sacct_chunk_days = 10
# Inferred on 2026-10-29 from the billing of cached narval jobs (A100 = 4.0 RGU/h, MIG slices
# k/7 of it, 1 core = 4.0/12). rgu_per_gb could not be inferred. `check --cluster narval` compares
# these with narval's TRESBillingWeights and prints the exact lines.
rgu_per_core = 0.333333
gpu a100 = 4, gres/gpu:a100
gpu 4g.20gb = 2.28571, gres/gpu:a100_4g.20gb
gpu 3g.20gb = 1.71429, gres/gpu:a100_3g.20gb
gpu 2g.10gb = 1.14286, gres/gpu:a100_2g.10gb
gpu 1g.5gb = 0.571429, gres/gpu:a100_1g.5gb
